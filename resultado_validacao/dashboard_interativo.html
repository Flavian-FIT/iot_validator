<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Interativo - IoT</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 2rem;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        .header {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .controls {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-box { flex: 1; min-width: 300px; }
        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--gray-300);
            border-radius: 0.5rem;
            font-size: 1rem;
        }

        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .student-card {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            position: relative;
        }

        .grade-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-weight: bold;
        }

        .grade-excellent { background: #d1fae5; color: #059669; }
        .grade-good { background: #dbeafe; color: #2563eb; }
        .grade-average { background: #fef3c7; color: #d97706; }
        .grade-poor { background: #fee2e2; color: #dc2626; }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-edit { background: var(--gray-100); color: var(--gray-800); margin-top: 1rem; width: 100%; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: white;
            border-radius: 1rem;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
        }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--gray-300);
            border-radius: 0.5rem;
        }
        .form-group textarea { min-height: 150px; font-family: monospace; }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 2rem;
        }

        .toast {
            position: fixed;
            bottom: 2rem; right: 2rem;
            padding: 1rem 2rem;
            background: var(--gray-800);
            color: white;
            border-radius: 0.5rem;
            display: none;
            z-index: 2000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🚀 Dashboard Interativo</h1>
                <p>Gerenciamento de Avaliações IoT</p>
            </div>
            <button class="btn btn-success" onclick="consolidateAll()">🔄 Consolidar e Atualizar</button>
        </div>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="search" placeholder="Buscar aluno..." oninput="filterStudents()">
            </div>
        </div>

        <div class="students-grid" id="grid">
            <!-- Cards loop -->
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h2 id="editTitle">Editar Aluno</h2>
            <hr style="margin: 1rem 0;">
            
            <div class="form-group">
                <label>Nota Manual (0-100)</label>
                <input type="number" id="manualGrade" min="0" max="100" step="0.1">
            </div>
            
            <div class="form-group">
                <label>Comentário do Professor</label>
                <textarea id="professorComment" placeholder="Excelente trabalho, mas..."></textarea>
            </div>

            <h3 style="margin-bottom: 1rem;">Conteúdo Manual</h3>
            
            <div class="form-group">
                <label>README.md</label>
                <textarea id="manualReadme" placeholder="Cole o README aqui..."></textarea>
            </div>

            <div class="form-group">
                <label>main.py</label>
                <textarea id="manualMainPy" placeholder="Cole o main.py aqui..."></textarea>
            </div>

            <div class="modal-footer">
                <button class="btn" onclick="closeModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveChanges()">Salvar Alterações</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Mensagem salva!</div>

    <script>
        let students = [];
        let currentStudent = null;

        async function loadData() {
            const res = await fetch('/api/students');
            students = await res.json();
            render();
        }

        function render() {
            const grid = document.getElementById('grid');
            const search = document.getElementById('search').value.toLowerCase();
            
            const filtered = students.filter(s => s.nome.toLowerCase().includes(search));
            
            grid.innerHTML = filtered.map(s => `
                <div class="student-card">
                    <div class="grade-badge ${getGradeClass(s.nota_final)}">${s.nota_final.toFixed(1)}</div>
                    <h3>${s.nome}</h3>
                    <p style="color: var(--gray-600); margin: 0.5rem 0;">${s.email || ''}</p>
                    <div style="font-size: 0.8rem; margin-top: 1rem;">
                        <strong>Auto:</strong> ${s.nota_automatica?.toFixed(1) || s.nota_final.toFixed(1)}
                        ${s.nota_manual ? `| <strong>Manual:</strong> ${s.nota_manual.toFixed(1)}` : ''}
                    </div>
                    <button class="btn btn-edit" onclick="openEdit('${s.nome}')">✏️ Editar Notas/Conteúdo</button>
                </div>
            `).join('');
        }

        function getGradeClass(grade) {
            if (grade >= 90) return 'grade-excellent';
            if (grade >= 70) return 'grade-good';
            if (grade >= 50) return 'grade-average';
            return 'grade-poor';
        }

        function filterStudents() { render(); }

        function openEdit(name) {
            currentStudent = students.find(s => s.nome === name);
            document.getElementById('editTitle').textContent = `Editar: ${name}`;
            document.getElementById('manualGrade').value = currentStudent.nota_manual || '';
            document.getElementById('professorComment').value = currentStudent.comentario_professor || '';
            
            // Try to load manual content if exists
            fetch(`/api/get_content?name=${encodeURIComponent(name)}`)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('manualReadme').value = data.readme || '';
                    document.getElementById('manualMainPy').value = data.main_py || '';
                });

            document.getElementById('editModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        async function saveChanges() {
            const name = currentStudent.nome;
            const grade = document.getElementById('manualGrade').value;
            const comment = document.getElementById('professorComment').value;
            const readme = document.getElementById('manualReadme').value;
            const main_py = document.getElementById('manualMainPy').value;

            // Save Grade
            await fetch('/api/update_grade', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, grade: parseFloat(grade), comment })
            });

            // Save Content
            await fetch('/api/update_content', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, readme, main_py })
            });

            showToast('Dados salvos com sucesso!');
            closeModal();
            loadData();
        }

        async function consolidateAll() {
            showToast('Consolidando avaliações... aguarde.');
            const res = await fetch('/api/consolidate', { method: 'POST' });
            if (res.ok) {
                showToast('Consolidação concluída!');
                loadData();
            } else {
                showToast('Erro na consolidação.');
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 3000);
        }

        loadData();
    </script>
</body>
</html>
